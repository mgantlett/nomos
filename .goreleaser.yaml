version: 2

project_name: nomos

before:
  hooks:
    - go -C substrate mod verify

builds:
  - id: nomos
    dir: substrate
    main: ./cmd/nomos
    binary: nomos
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mgantlett/nomos/substrate/cli.RootCmdVersion={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

dockers_v2:
  - id: nomos-ghcr
    dockerfile: Dockerfile
    ids:
      - nomos
    images:
      - "ghcr.io/mgantlett/nomos"
    tags:
      - "{{ .Version }}"
      - "v{{ .Major }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
    labels:
      "org.opencontainers.image.title": "Nomos"
      "org.opencontainers.image.description": "Deterministic engineering substrate and 42-gate AST verification layer between coding agents and Git"
      "org.opencontainers.image.source": "https://github.com/mgantlett/nomos"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.version": "{{ .Version }}"

homebrew_casks:
  - name: nomos
    binaries:
      - nomos
    homepage: "https://github.com/mgantlett/nomos"
    description: "Deterministic engineering substrate and 42-gate AST verification layer between coding agents and Git"
    license: "Apache-2.0"
    repository:
      owner: mgantlett
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    hooks:
      post:
        install_steps: |-
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/nomos"]
          end

scoops:
  - name: nomos
    directory: bucket
    homepage: "https://github.com/mgantlett/nomos"
    description: "Deterministic engineering substrate and 42-gate AST verification layer between coding agents and Git"
    license: "Apache-2.0"
    repository:
      owner: mgantlett
      name: scoop-bucket
      branch: main
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'

winget:
  - name: nomos
    publisher: "Mark Gantlett"
    package_identifier: mgantlett.nomos
    short_description: "Deterministic Go substrate and 42-gate AST verification layer for coding agents"
    description: "Deterministic engineering substrate and 42-gate AST verification layer between coding agents and Git"
    homepage: "https://github.com/mgantlett/nomos"
    license: "Apache-2.0"
    license_url: "https://github.com/mgantlett/nomos/blob/main/LICENSE"
    release_notes_url: "https://github.com/mgantlett/nomos/releases/tag/{{ .Tag }}"
    tags:
      - coding-agents
      - ast
      - verification
      - mcp
      - cli
    repository:
      owner: mgantlett
      name: winget-pkgs
      branch: "nomos-{{ .Version }}"
      token: '{{ .Env.WINGET_GITHUB_TOKEN }}'
    skip_upload: '{{ if index .Env "WINGET_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'

aurs:
  - name: nomos-bin
    homepage: "https://github.com/mgantlett/nomos"
    description: "Deterministic engineering substrate and 42-gate AST verification layer between coding agents and Git"
    maintainers:
      - "Mark Gantlett <mark@sophialabs.ca>"
    license: "Apache-2.0"
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: "ssh://aur@aur.archlinux.org/nomos-bin.git"
    skip_upload: '{{ if index .Env "AUR_KEY" }}auto{{ else }}true{{ end }}'
    package: |-
      install -Dm755 "./nomos" "${pkgdir}/usr/bin/nomos"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/nomos-bin/LICENSE"
      install -Dm644 "./NOTICE" "${pkgdir}/usr/share/licenses/nomos-bin/NOTICE"
      install -Dm644 "./THIRD_PARTY_NOTICES.md" "${pkgdir}/usr/share/licenses/nomos-bin/THIRD_PARTY_NOTICES.md"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/nomos-bin/README.md"
      install -Dm644 "./CHANGELOG.md" "${pkgdir}/usr/share/doc/nomos-bin/CHANGELOG.md"

nfpms:
  - id: nomos-linux-pkgs
    package_name: nomos
    ids:
      - nomos
    homepage: "https://sophialabs.ca"
    maintainer: "Mark Gantlett <mark@sophialabs.ca>"
    description: "Deterministic engineering substrate and 42-gate AST verification layer between coding agents and Git"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/nomos/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/nomos/NOTICE
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/licenses/nomos/THIRD_PARTY_NOTICES.md

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
