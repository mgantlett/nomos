version: 2

project_name: nomos

before:
  hooks:
    - go -C substrate mod verify

builds:
  - id: nomos
    dir: substrate
    main: ./cmd/nomos
    binary: nomos
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mgantlett/nomos/substrate/cli.RootCmdVersion={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

aurs:
  - name: nomos-bin
    homepage: "https://github.com/mgantlett/nomos"
    description: "Deterministic engineering substrate and 42-gate AST control harness for AI coding agents"
    maintainers:
      - "Mark Gantlett <mark@sophialabs.ca>"
    license: "Apache-2.0"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/nomos-bin.git"
    skip_upload: "{{ if .Env.AUR_KEY }}auto{{ else }}true{{ end }}"
    options:
      - "!strip"
      - "!debug"
    package: |-
      install -Dm755 "./nomos" "${pkgdir}/usr/bin/nomos"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/nomos-bin/LICENSE"
      install -Dm644 "./NOTICE" "${pkgdir}/usr/share/licenses/nomos-bin/NOTICE"
      install -Dm644 "./THIRD_PARTY_NOTICES.md" "${pkgdir}/usr/share/licenses/nomos-bin/THIRD_PARTY_NOTICES.md"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
