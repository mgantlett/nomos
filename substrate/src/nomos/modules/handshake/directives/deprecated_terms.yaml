  # --- ADR-0031: Agent Tiers & Adoption Profiles (INT-279) ---
  - term: "developer tier"
    deprecated_patterns:
      - "developer tier"
      - "consumer tier"
      - "customer tier"
      - "tier 3"
      - "tiers 2 and 3"
    canonical_replacement: "Adoption Profile (Solo / Team / Regulated); Foundry is internal-only"
    category: "taxonomy"
    reason: "ADR-0031: 'Tier' is reserved for coding agents. Downstream customers are named Adoption Profiles, never numbered tiers."
    severity: "high"

  - term: "bare tier"
    deprecated_patterns:
      - "tier 1 mode"
      - "tier 2 mode"
    canonical_replacement: "Tier 1 coding agent (indirect control, open-core) / Tier 2 coding agent (nomos code, direct control, sovereign)"
    category: "taxonomy"
    reason: "ADR-0031: always qualify Tier as 'Tier N coding agent' to prevent concept drift."
    severity: "medium"

  - term: "systemone"
    deprecated_patterns:
      - "systemone"
      - "system one"
      - "jev/kev"
    canonical_replacement: "(removed: cancelled spike)"
    category: "architecture"
    reason: "ADR-0031 §7: SystemOne decision-model spike (ADR-0026) cancelled; code and config removed from all repositories."
    severity: "high"

  - term: ".nomos/intent"
    deprecated_patterns:
      - ".nomos/intent"
    canonical_replacement: "root intent/ (intent/contracts + intent/architecture)"
    category: "topology"
