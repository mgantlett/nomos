name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to release (e.g. v4.9.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Fetch Nomos Release Receipts (Git Notes)
        run: |
          git fetch origin +refs/notes/nomos/releases:refs/notes/nomos/releases || true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'substrate/go.mod'
          cache-dependency-path: 'substrate/go.sum'

      - name: Pre-Flight Module, Test & 42-Gate Verification
        run: |
          go -C substrate mod verify
          CGO_ENABLED=0 go -C substrate build -o "$RUNNER_TEMP/nomos" ./cmd/nomos
          go -C substrate test ./...
          "$RUNNER_TEMP/nomos" verify --all --strict
          "$RUNNER_TEMP/nomos" verify proof

      - name: Extract Canonical Release Notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bash packaging/render-release-notes.sh "${RELEASE_TAG}" > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::Rendered release notes for ${RELEASE_TAG} are empty"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes "${{ runner.temp }}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
