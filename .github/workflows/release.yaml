name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'substrate/go.mod'

      - name: Pre-Flight Module, Test & 42-Gate Verification
        run: |
          go -C substrate mod verify
          CGO_ENABLED=0 go -C substrate build -o "$RUNNER_TEMP/nomos" ./cmd/nomos
          go -C substrate test ./...
          "$RUNNER_TEMP/nomos" verify --all --strict
          "$RUNNER_TEMP/nomos" verify proof

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
