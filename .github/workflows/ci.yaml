name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to release (e.g. v4.17.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Deterministic Quality Verification
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.detect_release.outputs.should_release }}
      release_tag: ${{ steps.detect_release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Fetch Nomos Release Receipts (Git Notes)
        run: |
          git fetch --tags --force origin || true
          git fetch origin +refs/notes/nomos/releases:refs/notes/nomos/releases || true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'substrate/go.mod'
          cache-dependency-path: 'substrate/go.sum'

      - name: Verify Go Module Checksums
        run: |
          go -C substrate mod verify

      - name: Build Substrate CLI
        run: |
          CGO_ENABLED=0 go -C substrate build -o "$RUNNER_TEMP/nomos" ./cmd/nomos
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Substrate Test Suite
        run: |
          go -C substrate test ./...

      - name: Verify 42 Definition of Done Quality Gates
        run: |
          nomos verify --all --strict

      - name: Attest Gate Integrity & Sensitivity Proof
        run: |
          nomos verify proof

      - name: Emit Zero-Trust Pull Request Proof Receipt
        if: github.event_name == 'pull_request'
        run: |
          nomos verify --pr --base-ref origin/main --mutate-diff --pr-output "$RUNNER_TEMP/pr-proof.md"
          cat "$RUNNER_TEMP/pr-proof.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Audit Bilateral Capabilities & Architectural Engines
        run: |
          nomos capabilities

      - name: Validate GoReleaser v2 Configuration Schema
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Detect Canonical Release Tag at HEAD
        id: detect_release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${DISPATCH_TAG}" ]; then
            echo "release_tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT_NAME}" != "push" ] || [ "${REF_NAME}" != "refs/heads/main" ]; then
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force origin || true
          HEAD_TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "${HEAD_TAG}" ]; then
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${HEAD_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft -q '.isDraft' 2>/dev/null | grep -qx 'false'; then
            echo "Release ${HEAD_TAG} is already published; skipping duplicate GoReleaser run."
            echo "release_tag=${HEAD_TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_tag=${HEAD_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  goreleaser:
    name: Publish Canonical Release
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.release_tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx for Multi-Arch GHCR Images
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'substrate/go.mod'
          cache-dependency-path: 'substrate/go.sum'

      - name: Extract Canonical Release Notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          bash packaging/render-release-notes.sh "${RELEASE_TAG}" > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::Rendered release notes for ${RELEASE_TAG} are empty"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes "${{ runner.temp }}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.verify.outputs.release_tag }}

  sync_registries:
    name: Sync Agent Package & MCP Registries
    needs: [verify, goreleaser]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve Canonical Package Version and Verify GitHub Release Exists
        id: pkg_ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLEAN_VER="$(jq -r '.version' server.json)"
          TAG_VER="v${CLEAN_VER}"
          echo "clean_ver=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG_VER}" --repo "${GITHUB_REPOSITORY}" --json isDraft -q '.isDraft' 2>/dev/null | grep -qx 'false'; then
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Release ${TAG_VER} not yet published; skipping downstream launcher/MCP registry sync."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js for npm Publishing
        if: steps.pkg_ver.outputs.release_ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Sync @mgantlett/nomos Launcher to npmjs.org
        if: steps.pkg_ver.outputs.release_ready == 'true'
        env:
          CLEAN_VER: ${{ steps.pkg_ver.outputs.clean_ver }}
          NPM_FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LIVE_NPM="$(curl -fsSL https://registry.npmjs.org/@mgantlett%2fnomos 2>/dev/null | jq -r '.["dist-tags"].latest // empty' || true)"
          if [ "${LIVE_NPM}" = "${CLEAN_VER}" ]; then
            echo "@mgantlett/nomos@${CLEAN_VER} already published on npmjs.org; skipping."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${NPM_FALLBACK_TOKEN:-}" ]; then
            echo "::notice::Neither GitHub OIDC nor NPM_TOKEN available; skipping CI npm publish."
            exit 0
          fi
          npm install -g npm@latest
          if [ -n "${NPM_FALLBACK_TOKEN:-}" ]; then
            npm config set '//registry.npmjs.org/:_authToken' "${NPM_FALLBACK_TOKEN}"
          fi
          (cd packaging/npm && npm publish --access public --provenance)
          for i in $(seq 1 24); do
            SEEN="$(curl -fsSL https://registry.npmjs.org/@mgantlett%2fnomos 2>/dev/null | jq -r --arg v "${CLEAN_VER}" '.versions[$v].version // empty' || true)"
            [ "${SEEN}" = "${CLEAN_VER}" ] && break
            sleep 5
          done

      - name: Set up Python for PyPI Publishing
        if: steps.pkg_ver.outputs.release_ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync nomos-cli Launcher to PyPI via GitHub OIDC
        id: pypi_sync
        if: steps.pkg_ver.outputs.release_ready == 'true'
        env:
          CLEAN_VER: ${{ steps.pkg_ver.outputs.clean_ver }}
        run: |
          if curl -fsSL "https://pypi.org/pypi/nomos-cli/${CLEAN_VER}/json" >/dev/null 2>&1; then
            echo "nomos-cli@${CLEAN_VER} already published on PyPI; skipping."
            echo "pypi_live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::GitHub OIDC token endpoint unavailable; skipping PyPI publish."
            echo "pypi_live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYPI_OIDC="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" | jq -r '.value // empty' || true)"
          PYPI_TOKEN="$(curl -sS -X POST https://pypi.org/_/oidc/mint-token -H "Content-Type: application/json" -d "{\"token\":\"${PYPI_OIDC}\"}" | jq -r '.token // empty' || true)"
          if [ -z "${PYPI_TOKEN}" ]; then
            echo "::notice::PyPI Pending Publisher not yet registered for mgantlett/nomos ci.yaml; skipping PyPI upload."
            echo "pypi_live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m pip install --upgrade build twine
          python3 -m build packaging/pypi
          TWINE_USERNAME=__token__ TWINE_PASSWORD="${PYPI_TOKEN}" python3 -m twine upload packaging/pypi/dist/*
          for i in $(seq 1 24); do
            if curl -fsSL "https://pypi.org/pypi/nomos-cli/${CLEAN_VER}/json" >/dev/null 2>&1; then
              echo "pypi_live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "pypi_live=false" >> "$GITHUB_OUTPUT"

      - name: Sync server.json to Official MCP Registry
        if: steps.pkg_ver.outputs.release_ready == 'true'
        env:
          CLEAN_VER: ${{ steps.pkg_ver.outputs.clean_ver }}
          PYPI_LIVE: ${{ steps.pypi_sync.outputs.pypi_live }}
        run: |
          LIVE_MCP="$(curl -fsSL https://registry.modelcontextprotocol.io/v0.1/servers/io.github.mgantlett%2Fnomos/versions/latest 2>/dev/null | jq -r '.server.version // empty' || true)"
          if [ "${LIVE_MCP}" = "${CLEAN_VER}" ]; then
            echo "io.github.mgantlett/nomos@${CLEAN_VER} already published on Official MCP Registry; skipping."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::GitHub OIDC token endpoint unavailable; skipping Official MCP Registry publish."
            exit 0
          fi
          OIDC_JWT="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mcp-registry" | jq -r '.value // empty' || true)"
          if [ -z "${OIDC_JWT}" ]; then
            echo "::notice::Empty GitHub OIDC token; skipping Official MCP Registry publish."
            exit 0
          fi
          REG_TOKEN="$(curl -fsSL -X POST https://registry.modelcontextprotocol.io/v0/auth/github-oidc -H "Authorization: Bearer ${OIDC_JWT}" -H "Content-Type: application/json" | jq -r '.registry_token // empty' || true)"
          if [ -z "${REG_TOKEN}" ]; then
            echo "::notice::Official MCP Registry OIDC exchange unavailable; skipping publish."
            exit 0
          fi
          PAYLOAD_FILE="server.json"
          if [ "${PYPI_LIVE}" != "true" ]; then
            jq '.packages |= map(select(.registryType != "pypi"))' server.json > "$RUNNER_TEMP/server-npm-only.json"
            PAYLOAD_FILE="$RUNNER_TEMP/server-npm-only.json"
          fi
          curl -fsSL -X POST https://registry.modelcontextprotocol.io/v0/publish \
            -H "Authorization: Bearer ${REG_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@${PAYLOAD_FILE}"

      - name: Package & Sync VS Code / Open VSX Extension (sophialabs.nomos)
        if: steps.pkg_ver.outputs.release_ready == 'true'
        env:
          CLEAN_VER: ${{ steps.pkg_ver.outputs.clean_ver }}
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ ! -f packaging/vscode/package.json ]; then
            echo "packaging/vscode/package.json not present; skipping."
            exit 0
          fi
          (cd packaging/vscode && node --test test/extension.test.js)
          VSIX_PATH="$RUNNER_TEMP/sophialabs.nomos-${CLEAN_VER}.vsix"
          (cd packaging/vscode && npx --yes @vscode/vsce package --no-dependencies -o "${VSIX_PATH}")
          gh release upload "v${CLEAN_VER}" "${VSIX_PATH}" --clobber --repo "${GITHUB_REPOSITORY}" || true
          if [ -n "${VSCE_PAT}" ]; then
            npx --yes @vscode/vsce publish --packagePath "${VSIX_PATH}" -p "${VSCE_PAT}"
          else
            echo "::notice::VSCE_PAT not configured; skipping Visual Studio Marketplace publish."
          fi
          if [ -n "${OVSX_PAT}" ]; then
            npx --yes ovsx publish "${VSIX_PATH}" -p "${OVSX_PAT}"
          else
            echo "::notice::OVSX_PAT not configured; skipping Open VSX Registry publish."
          fi


