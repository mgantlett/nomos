<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 528" width="1160" height="528" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Nomos Deterministic Execution Substrate - Day-0 Brownfield X-Ray and Runtime AST Governance</title>
  <desc id="heroDesc">Two-stage terminal workflow: Left pane audits a brownfield repository with nomos xray in 412ms and freezes existing debt with nomos init --baseline. Right pane blocks direct commits on main, catches an untested AST stub and swallowed error during nomos verify, and releases cleanly via nomos task sync with a SHA-256 Git Notes receipt.</desc>

  <defs>
    <linearGradient id="outerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="22%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="78%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="paneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <linearGradient id="brandTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="horizonRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#6366f1" stop-opacity="0.75"/>
      <stop offset="72%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="topBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.45"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 12.2px; font-variant-ligatures: none; }
      .mono-sm { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 11.2px; font-variant-ligatures: none; }
      .mono-xs { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.4px; font-variant-ligatures: none; }
      .bold { font-weight: 700; }
      .c-alabaster { fill: #f8fafc; }
      .c-value { fill: #e2e8f0; }
      .c-label { fill: #94a3b8; }
      .c-muted { fill: #64748b; }
      .c-cmd { fill: #7dd3fc; font-weight: 700; }
      .c-cyan { fill: #38bdf8; font-weight: 700; }
      .c-elec { fill: #22d3ee; font-weight: 700; }
      .c-purple { fill: #c084fc; font-weight: 700; }
      .c-mint { fill: #34d399; font-weight: 700; }
      .c-amber { fill: #fbbf24; font-weight: 700; }
      .c-coral { fill: #f87171; font-weight: 700; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="1159" height="527" rx="14" fill="url(#outerBg)" stroke="#1e293b" stroke-width="1"/>
  <rect x="1" y="1" width="1158" height="210" rx="14" fill="url(#cyanGlow)"/>
  <rect x="1" y="1" width="1158" height="210" rx="14" fill="url(#purpleGlow)"/>
  <line x1="24" y1="1" x2="1136" y2="1" stroke="url(#topBorderGrad)" stroke-width="1.5"/>

  <!-- Top Telemetry Ribbon -->
  <g transform="translate(20, 12)">
    <rect x="0" y="0" width="8.5" height="8.5" rx="1.8" fill="#38bdf8" transform="translate(0, 5.5) rotate(45 4.25 4.25)"/>
    <text x="17" y="14" class="sans" font-size="11.5">
      <tspan class="bold" letter-spacing="0.8" fill="#f8fafc">NOMOS SUBSTRATE</tspan>
      <tspan dx="8" fill="#64748b">·  Zero-Config Brownfield Ratchet + Deterministic Git Airlock</tspan>
    </text>

    <!-- Right capability pills -->
    <g transform="translate(658, 0)">
      <rect x="0" y="0" width="102" height="20" rx="10" fill="#082438" stroke="#0ea5e9" stroke-opacity="0.35"/>
      <text x="51" y="13.5" text-anchor="middle" class="mono-xs bold" fill="#38bdf8">11 Languages</text>

      <rect x="110" y="0" width="116" height="20" rx="10" fill="#082438" stroke="#0ea5e9" stroke-opacity="0.35"/>
      <text x="168" y="13.5" text-anchor="middle" class="mono-xs bold" fill="#7dd3fc">~24ms AST Radar</text>

      <rect x="234" y="0" width="104" height="20" rx="10" fill="#1f1033" stroke="#a855f7" stroke-opacity="0.35"/>
      <text x="286" y="13.5" text-anchor="middle" class="mono-xs bold" fill="#c084fc">42 DoD Gates</text>

      <rect x="346" y="0" width="136" height="20" rx="10" fill="#06281e" stroke="#10b981" stroke-opacity="0.35"/>
      <text x="414" y="13.5" text-anchor="middle" class="mono-xs bold" fill="#34d399">0 LLM Judge Tokens</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- LEFT TERMINAL PANE: DAY 0 BROWNFIELD X-RAY & RATCHET                  -->
  <!-- ===================================================================== -->
  <g transform="translate(16, 43)">
    <rect x="0" y="0" width="553" height="469" rx="10" fill="url(#paneBg)" stroke="#1e293b" stroke-width="1"/>
    <!-- Window Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 543 0 Q 553 0 553 10 L 553 34 L 0 34 Z" fill="#0d1526"/>
    <line x1="0" y1="34" x2="553" y2="34" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="32" cy="17" r="4.5" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="46" cy="17" r="4.5" fill="#34d399" fill-opacity="0.85"/>
    <text x="64" y="21" class="mono-sm bold" fill="#f8fafc">1. DAY-0 AUDIT &amp; BASELINE</text>
    <text x="254" y="21" class="mono-xs" fill="#64748b">~/payments-api (main)</text>
    <rect x="421" y="8" width="118" height="18" rx="4" fill="#082438" stroke="#38bdf8" stroke-opacity="0.32"/>
    <text x="480" y="20.5" text-anchor="middle" class="mono-xs bold" fill="#38bdf8">READ-ONLY · 412ms</text>

    <!-- Terminal Body -->
    <g transform="translate(18, 56)">
      <!-- Prompt 1: nomos xray . -->
      <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos xray .</tspan></text>

      <!-- Brand Title + Rule -->
      <g transform="translate(0, 22)">
        <circle cx="6" cy="-4" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
        <circle cx="6" cy="-4" r="1.5" fill="#38bdf8"/>
        <text x="17" y="0" class="mono bold" fill="url(#brandTitleGrad)">Nomos Brownfield X-Ray · payments-api (412ms)</text>
        <rect x="0" y="8" width="517" height="1.5" fill="url(#horizonRule)"/>
      </g>

      <!-- Tabular Key-Value Summary Rows -->
      <g transform="translate(0, 49)">
        <!-- Score + Grade C Pill -->
        <text x="8" y="0" class="mono c-label">AI Hangover Score</text>
        <text x="142" y="0" class="mono c-muted">:</text>
        <text x="154" y="0" class="mono c-alabaster bold">34/100</text>
        <rect x="208" y="-12" width="62" height="16" rx="3" fill="#291d07" stroke="#fbbf24" stroke-opacity="0.45"/>
        <text x="239" y="0" text-anchor="middle" class="mono-xs c-amber">Grade C</text>

        <text x="8" y="20" class="mono c-label">Corpus Footprint</text>
        <text x="142" y="20" class="mono c-muted">:</text>
        <text x="154" y="20" class="mono"><tspan class="c-alabaster bold">312</tspan> <tspan class="c-value">files ·</tspan> <tspan class="c-alabaster bold">68,420</tspan> <tspan class="c-value">LOC ·</tspan> <tspan class="c-muted">go:198 ts:114</tspan></text>

        <text x="8" y="40" class="mono c-label">Debt Signals</text>
        <text x="142" y="40" class="mono c-muted">:</text>
        <text x="154" y="40" class="mono"><tspan class="c-amber">4</tspan> <tspan class="c-value">clones ·</tspan> <tspan class="c-amber">6</tspan> <tspan class="c-value">monoliths ·</tspan> <tspan class="c-amber">9</tspan> <tspan class="c-value">oversized funcs</tspan></text>

        <text x="8" y="60" class="mono c-label">Signature &amp; Reuse</text>
        <text x="142" y="60" class="mono c-muted">:</text>
        <text x="154" y="60" class="mono"><tspan class="c-amber">5</tspan> <tspan class="c-value">high-arity ·</tspan> <tspan class="c-amber">3</tspan> <tspan class="c-value">deep-nesting ·</tspan> <tspan class="c-amber">2</tspan> <tspan class="c-value">magic-str</tspan></text>

        <text x="8" y="80" class="mono c-label">Anti-Cheat Radar</text>
        <text x="142" y="80" class="mono c-muted">:</text>
        <text x="154" y="80" class="mono"><tspan class="c-amber">2</tspan> <tspan class="c-value">stubs ·</tspan> <tspan class="c-amber">3</tspan> <tspan class="c-value">swallowed err ·</tspan> <tspan class="c-coral">1</tspan> <tspan class="c-value">secret/path leak</tspan></text>

        <text x="8" y="100" class="mono c-label">Clean Boundaries</text>
        <text x="142" y="100" class="mono c-muted">:</text>
        <text x="154" y="100" class="mono"><tspan class="c-mint">2</tspan> <tspan class="c-value">zero-violation architecture rules ready</tspan></text>

        <!-- Hotspots -->
        <text x="8" y="123" class="mono c-alabaster bold">Top Hotspots:</text>
        <text x="16" y="142" class="mono-sm"><tspan class="c-muted">1.</tspan> <tspan class="c-cmd">pkg/checkout/charge.go</tspan></text>
        <text x="208" y="142" class="mono-sm"><tspan class="c-muted">[</tspan><tspan class="c-cyan">go</tspan> <tspan class="c-value">· 618 LOC · CDS</tspan> <tspan class="c-coral">92</tspan> <tspan class="c-value">· V(G) 24</tspan><tspan class="c-muted">]</tspan></text>
        <text x="34" y="157" class="mono-xs c-muted">(file_loc=618&gt;400, params=10&gt;8, swallowed_errors=2)</text>

        <text x="16" y="176" class="mono-sm"><tspan class="c-muted">2.</tspan> <tspan class="c-cmd">web/api/webhook_sync.ts</tspan></text>
        <text x="208" y="176" class="mono-sm"><tspan class="c-muted">[</tspan><tspan class="c-cyan">ts</tspan> <tspan class="c-value">· 445 LOC · CDS</tspan> <tspan class="c-amber">64</tspan> <tspan class="c-value">· V(G) 21</tspan><tspan class="c-muted">]</tspan></text>
        <text x="34" y="191" class="mono-xs c-muted">(complexity=21&gt;15, nesting=7&gt;5, secret_leaks=1)</text>

        <rect x="0" y="203" width="517" height="1.5" fill="url(#horizonRule)"/>

        <!-- Next Actions -->
        <text x="8" y="221" class="mono-sm"><tspan class="c-purple">◈</tspan> <tspan class="c-alabaster bold">Next Actions:</tspan></text>
        <text x="20" y="238" class="mono-sm"><tspan class="c-cyan">→</tspan> <tspan class="c-cmd">nomos init --baseline</tspan> <tspan class="c-muted">(Freeze Day-0 ratchet baseline)</tspan></text>
      </g>

      <!-- Prompt 2: nomos init baseline -->
      <g transform="translate(0, 314)">
        <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos init --baseline</tspan></text>
        <text x="8" y="21" class="mono-sm"><tspan class="c-mint">✓</tspan> <tspan class="c-value">Scaffolded</tspan> <tspan class="c-cmd">nomos.yaml</tspan><tspan class="c-value">,</tspan> <tspan class="c-cmd">AGENTS.md</tspan><tspan class="c-value">, and</tspan> <tspan class="c-cmd">nomos.baseline.json</tspan></text>
        <text x="8" y="40" class="mono-sm"><tspan class="c-mint">✓</tspan> <tspan class="c-value">Froze</tspan> <tspan class="c-alabaster bold">312-file</tspan> <tspan class="c-value">debt envelope</tspan> <tspan class="c-muted">(0 upfront warning fixes needed)</tspan></text>
        <text x="8" y="59" class="mono-sm"><tspan class="c-mint">✓</tspan> <tspan class="c-value">Locked</tspan> <tspan class="c-alabaster bold">main</tspan> <tspan class="c-value">read-only · diff ratchet active on touched files</tspan></text>
      </g>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT TERMINAL PANE: DAY 1+ AGENT GUARDRAIL & 2PC RELEASE             -->
  <!-- ===================================================================== -->
  <g transform="translate(591, 43)">
    <rect x="0" y="0" width="553" height="469" rx="10" fill="url(#paneBg)" stroke="#1e293b" stroke-width="1"/>
    <!-- Window Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 543 0 Q 553 0 553 10 L 553 34 L 0 34 Z" fill="#0d1526"/>
    <line x1="0" y1="34" x2="553" y2="34" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="32" cy="17" r="4.5" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="46" cy="17" r="4.5" fill="#34d399" fill-opacity="0.85"/>
    <text x="64" y="21" class="mono-sm bold" fill="#f8fafc">2. AGENT GUARDRAIL &amp; 2PC SYNC</text>
    <text x="282" y="21" class="mono-xs" fill="#64748b">worktrees/...-SUB-1</text>
    <rect x="441" y="8" width="98" height="18" rx="4" fill="#06281e" stroke="#34d399" stroke-opacity="0.38"/>
    <text x="490" y="20.5" text-anchor="middle" class="mono-xs bold" fill="#34d399">FAIL-CLOSED</text>

    <!-- Terminal Body -->
    <g transform="translate(18, 56)">
      <!-- Step A: Blocked direct commit on main -->
      <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">git commit -m "add refund endpoint"</tspan> <tspan class="c-muted"># attempted on main</tspan></text>
      <text x="8" y="19" class="mono-sm"><tspan class="c-coral">✗ [ERR_BOUNDARY]</tspan> <tspan class="c-value">main is physically read-only (Law 3)</tspan></text>
      <text x="22" y="36" class="mono-xs"><tspan class="c-amber">Remedy:</tspan> <tspan class="c-cmd">nomos task chore "Add idempotent refund"</tspan> <tspan class="c-muted">-&gt; SUB-1</tspan></text>

      <!-- Step B: Agent writes lazy stub + swallowed error -> nomos verify catches it -->
      <g transform="translate(0, 64)">
        <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos verify</tspan> <tspan class="c-muted"># agent wrote empty stub + ignored error</tspan></text>

        <g transform="translate(0, 22)">
          <path d="M 6 -9 L 11 -7 L 11 -2 C 11 1.5 8.5 3.5 6 4.5 C 3.5 3.5 1 1.5 1 -2 L 1 -7 Z" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="17" y="0" class="mono bold" fill="url(#brandTitleGrad)">Nomos Substrate · Definition of Done</text>
          <rect x="302" y="-12" width="48" height="16" rx="3" fill="#2c0b14" stroke="#f87171" stroke-opacity="0.45"/>
          <text x="326" y="0" text-anchor="middle" class="mono-xs c-coral">FAIL</text>
          <rect x="0" y="8" width="517" height="1.5" fill="url(#horizonRule)"/>
        </g>

        <text x="8" y="47" class="mono-sm c-coral">✗ Verification Failed · 40/42 Gates Passed (28ms)</text>

        <text x="16" y="67" class="mono-sm"><tspan class="c-coral">! [Anti-Shim AST Gate]</tspan> <tspan class="c-value">charge.go:88 Refund() is an empty stub</tspan></text>
        <text x="30" y="83" class="mono-xs"><tspan class="c-amber">Remedy:</tspan> <tspan class="c-value">implement Refund() body and remove placeholder return</tspan></text>

        <text x="16" y="103" class="mono-sm"><tspan class="c-coral">! [Unchecked Errors Gate]</tspan> <tspan class="c-value">charge.go:104 ignored err on tx.Save()</tspan></text>
        <text x="30" y="119" class="mono-xs"><tspan class="c-amber">Remedy:</tspan> <tspan class="c-value">propagate or handle returned error + maintain &gt;=0% cov</tspan></text>

        <rect x="0" y="131" width="517" height="1.5" fill="url(#horizonRule)"/>
      </g>

      <!-- Step C: Agent self-heals from Remedy -> 1-turn atomic 2PC release -->
      <g transform="translate(0, 224)">
        <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos task sync SUB-1 -m "feat(checkout): idempotent refund"</tspan></text>

        <g transform="translate(0, 21)">
          <rect x="0" y="-10" width="517" height="134" rx="6" fill="#071318" stroke="#1e293b" stroke-width="1"/>

          <!-- Row 1 -->
          <text x="14" y="9" class="mono-sm c-label">Law 1-7 Invariant Matrix</text>
          <text x="198" y="9" class="mono-sm c-muted">[21/21 Cells]</text>
          <rect x="330" y="-3" width="42" height="15" rx="3" fill="#06281e" stroke="#34d399" stroke-opacity="0.4"/>
          <text x="351" y="8.5" text-anchor="middle" class="mono-xs c-mint">PASS</text>
          <text x="382" y="9" class="mono-xs c-muted">(394ms)</text>

          <!-- Row 2 -->
          <text x="14" y="29" class="mono-sm c-label">Brownfield Diff Ratchet</text>
          <text x="198" y="29" class="mono-sm c-muted">CDS -14 · Cov +6%</text>
          <rect x="330" y="17" width="42" height="15" rx="3" fill="#06281e" stroke="#34d399" stroke-opacity="0.4"/>
          <text x="351" y="28.5" text-anchor="middle" class="mono-xs c-mint">PASS</text>
          <text x="382" y="29" class="mono-xs c-muted">(charge.go)</text>

          <!-- Row 3 -->
          <text x="14" y="49" class="mono-sm c-label">Diff AST Mutation Proof</text>
          <text x="198" y="49" class="mono-sm c-muted">6/6 Killed (100%)</text>
          <rect x="330" y="37" width="42" height="15" rx="3" fill="#06281e" stroke="#34d399" stroke-opacity="0.4"/>
          <text x="351" y="48.5" text-anchor="middle" class="mono-xs c-mint">PASS</text>
          <text x="382" y="49" class="mono-xs c-muted">(0 tautologies)</text>

          <line x1="14" y1="62" x2="503" y2="62" stroke="#1e293b" stroke-width="1"/>

          <text x="14" y="80" class="mono-sm c-mint">✓ All Laws Enforced · 42/42 Gates Satisfied</text>
          <text x="14" y="99" class="mono-sm"><tspan class="c-mint">✓ Fast-forwarded main</tspan> <tspan class="c-muted">&amp; pruned worktrees/payments-api-SUB-1</tspan></text>
          <text x="14" y="116" class="mono-xs"><tspan class="c-cyan">◈ SHA-256 Receipt:</tspan> <tspan class="c-value">9f4c2e8a...d107</tspan> <tspan class="c-muted">-&gt; refs/notes/nomos/releases</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- Center Transition Connector (rendered on top with halo ring) -->
  <g transform="translate(580, 278)">
    <circle cx="0" cy="0" r="15" fill="#070c18"/>
    <circle cx="0" cy="0" r="12.5" fill="#0d1526" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" class="mono bold" fill="#38bdf8">→</text>
