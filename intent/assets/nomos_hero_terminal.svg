<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Nomos Deterministic Execution Substrate - Day-0 Brownfield X-Ray and Runtime AST Governance</title>
  <desc id="heroDesc">Two-stage terminal workflow: Left pane audits a brownfield repository with nomos xray in 412ms and freezes existing debt with nomos init --baseline. Right pane blocks direct commits on main, catches an untested AST stub and swallowed error during nomos verify, and releases cleanly via nomos task sync with a SHA-256 Git Notes receipt.</desc>

  <defs>
    <linearGradient id="outerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="22%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="78%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="paneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <linearGradient id="brandTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="horizonRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#6366f1" stop-opacity="0.75"/>
      <stop offset="72%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="topBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.45"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 13.0px; font-variant-ligatures: none; }
      .mono-sm { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 12.1px; font-variant-ligatures: none; }
      .mono-xs { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 11.2px; font-variant-ligatures: none; }
      .bold { font-weight: 700; }
      .c-alabaster { fill: #f8fafc; }
      .c-value { fill: #e2e8f0; }
      .c-label { fill: #94a3b8; }
      .c-muted { fill: #64748b; }
      .c-cmd { fill: #7dd3fc; font-weight: 700; }
      .c-cyan { fill: #38bdf8; font-weight: 700; }
      .c-elec { fill: #22d3ee; font-weight: 700; }
      .c-purple { fill: #c084fc; font-weight: 700; }
      .c-mint { fill: #34d399; font-weight: 700; }
      .c-amber { fill: #fbbf24; font-weight: 700; }
      .c-coral { fill: #f87171; font-weight: 700; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="939" height="511" rx="14" fill="url(#outerBg)" stroke="#1e293b" stroke-width="1"/>
  <rect x="1" y="1" width="938" height="210" rx="14" fill="url(#cyanGlow)"/>
  <rect x="1" y="1" width="938" height="210" rx="14" fill="url(#purpleGlow)"/>
  <line x1="20" y1="1" x2="920" y2="1" stroke="url(#topBorderGrad)" stroke-width="1.5"/>

  <!-- Top Telemetry Ribbon (x=12..928, matching Pane 1 left & Pane 2 right) -->
  <g transform="translate(12, 11)">
    <rect x="0" y="0" width="8.5" height="8.5" rx="1.8" fill="#38bdf8" transform="translate(2, 6) rotate(45 4.25 4.25)"/>
    <text x="19" y="14.5" class="sans" font-size="12.2">
      <tspan class="bold" letter-spacing="0.7" fill="#f8fafc">NOMOS SUBSTRATE</tspan>
      <tspan dx="7" fill="#64748b">·  Brownfield Ratchet + Git Airlock</tspan>
    </text>

    <!-- Right capability pills: 96 + 6 + 90 + 6 + 80 + 6 + 104 = 388px; 12 + 528 + 388 = 928 -->
    <g transform="translate(528, 0)">
      <rect x="0" y="0" width="96" height="21" rx="10.5" fill="#082438" stroke="#0ea5e9" stroke-opacity="0.35"/>
      <text x="48" y="14.2" text-anchor="middle" class="mono-xs bold" fill="#38bdf8">11 Languages</text>

      <rect x="102" y="0" width="90" height="21" rx="10.5" fill="#082438" stroke="#0ea5e9" stroke-opacity="0.35"/>
      <text x="147" y="14.2" text-anchor="middle" class="mono-xs bold" fill="#7dd3fc">~24ms AST</text>

      <rect x="198" y="0" width="80" height="21" rx="10.5" fill="#1f1033" stroke="#a855f7" stroke-opacity="0.35"/>
      <text x="238" y="14.2" text-anchor="middle" class="mono-xs bold" fill="#c084fc">42 Gates</text>

      <rect x="284" y="0" width="104" height="21" rx="10.5" fill="#06281e" stroke="#10b981" stroke-opacity="0.35"/>
      <text x="336" y="14.2" text-anchor="middle" class="mono-xs bold" fill="#34d399">0 LLM Tokens</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- LEFT TERMINAL PANE: DAY 0 BROWNFIELD X-RAY & RATCHET (x=12..458)      -->
  <!-- ===================================================================== -->
  <g transform="translate(12, 42)">
    <rect x="0" y="0" width="446" height="458" rx="10" fill="url(#paneBg)" stroke="#1e293b" stroke-width="1"/>
    <!-- Window Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 436 0 Q 446 0 446 10 L 446 35 L 0 35 Z" fill="#0d1526"/>
    <line x1="0" y1="35" x2="446" y2="35" stroke="#1e293b" stroke-width="1"/>
    <circle cx="16" cy="17.5" r="4.5" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="30" cy="17.5" r="4.5" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="44" cy="17.5" r="4.5" fill="#34d399" fill-opacity="0.85"/>
    <text x="60" y="21.5" class="mono-sm bold" fill="#f8fafc">1. DAY-0 AUDIT &amp; BASELINE</text>
    <rect x="316" y="8" width="118" height="19" rx="4" fill="#082438" stroke="#38bdf8" stroke-opacity="0.32"/>
    <text x="375" y="21" text-anchor="middle" class="mono-xs bold" fill="#38bdf8">READ-ONLY · 412ms</text>

    <!-- Terminal Body (inner width 418px) -->
    <g transform="translate(14, 57)">
      <!-- Prompt 1: nomos xray . -->
      <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos xray .</tspan> <tspan class="c-muted"># ~/payments-api</tspan></text>

      <!-- Brand Title + Rule -->
      <g transform="translate(0, 23)">
        <circle cx="6" cy="-4.5" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
        <circle cx="6" cy="-4.5" r="1.5" fill="#38bdf8"/>
        <text x="16" y="0" class="mono-sm bold" fill="url(#brandTitleGrad)">Nomos Brownfield X-Ray · payments-api (412ms)</text>
        <rect x="0" y="8" width="418" height="1.5" fill="url(#horizonRule)"/>
      </g>

      <!-- Tabular Key-Value Summary Rows -->
      <g transform="translate(0, 51)">
        <!-- Score + Grade C Pill -->
        <text x="4" y="0" class="mono-sm c-label">Hangover Score</text>
        <text x="118" y="0" class="mono-sm c-muted">:</text>
        <text x="129" y="0" class="mono-sm c-alabaster bold">34/100</text>
        <rect x="184" y="-12.5" width="64" height="17" rx="3" fill="#291d07" stroke="#fbbf24" stroke-opacity="0.45"/>
        <text x="216" y="0" text-anchor="middle" class="mono-xs c-amber">Grade C</text>

        <text x="4" y="21" class="mono-sm c-label">Footprint</text>
        <text x="118" y="21" class="mono-sm c-muted">:</text>
        <text x="129" y="21" class="mono-sm"><tspan class="c-alabaster bold">312</tspan> <tspan class="c-value">files ·</tspan> <tspan class="c-alabaster bold">68.4k</tspan> <tspan class="c-value">LOC ·</tspan> <tspan class="c-muted">go/ts</tspan></text>

        <text x="4" y="42" class="mono-sm c-label">Debt Signals</text>
        <text x="118" y="42" class="mono-sm c-muted">:</text>
        <text x="129" y="42" class="mono-sm"><tspan class="c-amber">4</tspan> <tspan class="c-value">clones ·</tspan> <tspan class="c-amber">6</tspan> <tspan class="c-value">monoliths ·</tspan> <tspan class="c-amber">9</tspan> <tspan class="c-value">long fn</tspan></text>

        <text x="4" y="63" class="mono-sm c-label">Signatures</text>
        <text x="118" y="63" class="mono-sm c-muted">:</text>
        <text x="129" y="63" class="mono-sm"><tspan class="c-amber">5</tspan> <tspan class="c-value">&gt;8-param ·</tspan> <tspan class="c-amber">3</tspan> <tspan class="c-value">deep-nest ·</tspan> <tspan class="c-amber">2</tspan> <tspan class="c-value">magic</tspan></text>

        <text x="4" y="84" class="mono-sm c-label">Anti-Cheat</text>
        <text x="118" y="84" class="mono-sm c-muted">:</text>
        <text x="129" y="84" class="mono-sm"><tspan class="c-amber">2</tspan> <tspan class="c-value">stubs ·</tspan> <tspan class="c-amber">3</tspan> <tspan class="c-value">swallowed err ·</tspan> <tspan class="c-coral">1</tspan> <tspan class="c-value">leak</tspan></text>

        <text x="4" y="105" class="mono-sm c-label">Boundaries</text>
        <text x="118" y="105" class="mono-sm c-muted">:</text>
        <text x="129" y="105" class="mono-sm"><tspan class="c-mint">2</tspan> <tspan class="c-value">architecture rules ready to lock</tspan></text>

        <!-- Hotspots -->
        <text x="4" y="129" class="mono-sm c-alabaster bold">Top Hotspots:</text>
        <text x="10" y="149" class="mono-sm"><tspan class="c-muted">1.</tspan> <tspan class="c-cmd">pkg/checkout/charge.go</tspan></text>
        <text x="234" y="149" class="mono-sm"><tspan class="c-muted">[</tspan><tspan class="c-cyan">go</tspan> <tspan class="c-value">· 618L · CDS</tspan> <tspan class="c-coral">92</tspan><tspan class="c-muted">]</tspan></text>
        <text x="28" y="165" class="mono-xs c-muted">(loc=618&gt;400, params=10&gt;8, swallowed_err=2)</text>

        <text x="10" y="185" class="mono-sm"><tspan class="c-muted">2.</tspan> <tspan class="c-cmd">web/api/webhook_sync.ts</tspan></text>
        <text x="234" y="185" class="mono-sm"><tspan class="c-muted">[</tspan><tspan class="c-cyan">ts</tspan> <tspan class="c-value">· 445L · CDS</tspan> <tspan class="c-amber">64</tspan><tspan class="c-muted">]</tspan></text>
        <text x="28" y="201" class="mono-xs c-muted">(complexity=21&gt;15, nesting=7&gt;5, secret=1)</text>

        <rect x="0" y="213" width="418" height="1.5" fill="url(#horizonRule)"/>

        <!-- Next Actions -->
        <text x="4" y="232" class="mono-sm"><tspan class="c-purple">◈</tspan> <tspan class="c-alabaster bold">Next:</tspan> <tspan class="c-cmd">nomos init --baseline</tspan> <tspan class="c-muted">(Freeze Day 0)</tspan></text>
      </g>

      <!-- Prompt 2: nomos init baseline -->
      <g transform="translate(0, 314)">
        <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos init --baseline</tspan></text>
        <text x="6" y="22" class="mono-sm"><tspan class="c-mint">✓</tspan> <tspan class="c-value">Saved</tspan> <tspan class="c-cmd">nomos.yaml</tspan><tspan class="c-value">,</tspan> <tspan class="c-cmd">AGENTS.md</tspan> <tspan class="c-value">&amp;</tspan> <tspan class="c-cmd">nomos.baseline.json</tspan></text>
        <text x="6" y="42" class="mono-sm"><tspan class="c-mint">✓</tspan> <tspan class="c-value">Froze</tspan> <tspan class="c-alabaster bold">312-file</tspan> <tspan class="c-value">debt (0 upfront fixes needed)</tspan></text>
        <text x="6" y="62" class="mono-sm"><tspan class="c-mint">✓</tspan> <tspan class="c-value">Locked</tspan> <tspan class="c-alabaster bold">main</tspan> <tspan class="c-value">read-only · diff ratchet active</tspan></text>
      </g>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT TERMINAL PANE: DAY 1+ AGENT GUARDRAIL & 2PC RELEASE (x=482..928) -->
  <!-- ===================================================================== -->
  <g transform="translate(482, 42)">
    <rect x="0" y="0" width="446" height="458" rx="10" fill="url(#paneBg)" stroke="#1e293b" stroke-width="1"/>
    <!-- Window Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 436 0 Q 446 0 446 10 L 446 35 L 0 35 Z" fill="#0d1526"/>
    <line x1="0" y1="35" x2="446" y2="35" stroke="#1e293b" stroke-width="1"/>
    <circle cx="16" cy="17.5" r="4.5" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="30" cy="17.5" r="4.5" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="44" cy="17.5" r="4.5" fill="#34d399" fill-opacity="0.85"/>
    <text x="60" y="21.5" class="mono-sm bold" fill="#f8fafc">2. AGENT GUARDRAIL &amp; 2PC SYNC</text>
    <rect x="336" y="8" width="98" height="19" rx="4" fill="#06281e" stroke="#34d399" stroke-opacity="0.38"/>
    <text x="385" y="21" text-anchor="middle" class="mono-xs bold" fill="#34d399">FAIL-CLOSED</text>

    <!-- Terminal Body (inner width 418px) -->
    <g transform="translate(14, 57)">
      <!-- Step A: Blocked direct commit on main -->
      <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">git commit -m "add refund"</tspan> <tspan class="c-muted"># on main</tspan></text>
      <text x="6" y="20" class="mono-sm"><tspan class="c-coral">✗ [ERR_BOUNDARY]</tspan> <tspan class="c-value">main is read-only (Law 3)</tspan></text>
      <text x="18" y="38" class="mono-xs"><tspan class="c-amber">Remedy:</tspan> <tspan class="c-cmd">nomos task chore "Add refund"</tspan> <tspan class="c-muted">-&gt; SUB-1</tspan></text>

      <!-- Step B: Agent writes lazy stub + swallowed error -> nomos verify catches it -->
      <g transform="translate(0, 67)">
        <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos verify</tspan> <tspan class="c-muted"># stub + ignored error</tspan></text>

        <g transform="translate(0, 23)">
          <path d="M 6 -9.5 L 11 -7.5 L 11 -2 C 11 1.5 8.5 3.5 6 4.5 C 3.5 3.5 1 1.5 1 -2 L 1 -7.5 Z" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="16" y="0" class="mono-sm bold" fill="url(#brandTitleGrad)">Nomos · Definition of Done</text>
          <rect x="236" y="-12.5" width="48" height="17" rx="3" fill="#2c0b14" stroke="#f87171" stroke-opacity="0.45"/>
          <text x="260" y="0" text-anchor="middle" class="mono-xs c-coral">FAIL</text>
          <rect x="0" y="8" width="418" height="1.5" fill="url(#horizonRule)"/>
        </g>

        <text x="6" y="49" class="mono-sm c-coral">✗ Failed · 40/42 Gates Passed (28ms)</text>

        <text x="12" y="70" class="mono-sm"><tspan class="c-coral">! [Anti-Shim Gate]</tspan> <tspan class="c-value">charge.go:88 empty stub</tspan></text>
        <text x="26" y="87" class="mono-xs"><tspan class="c-amber">Remedy:</tspan> <tspan class="c-value">implement Refund() body &amp; return</tspan></text>

        <text x="12" y="108" class="mono-sm"><tspan class="c-coral">! [Unchecked Err]</tspan> <tspan class="c-value">charge.go:104 tx.Save()</tspan></text>
        <text x="26" y="125" class="mono-xs"><tspan class="c-amber">Remedy:</tspan> <tspan class="c-value">handle returned err + keep &gt;=0% cov</tspan></text>

        <rect x="0" y="137" width="418" height="1.5" fill="url(#horizonRule)"/>
      </g>

      <!-- Step C: Agent self-heals from Remedy -> 1-turn atomic 2PC release -->
      <g transform="translate(0, 234)">
        <text x="0" y="0" class="mono"><tspan class="c-elec">❯</tspan> <tspan class="c-alabaster bold">nomos task sync SUB-1 -m "feat: refund"</tspan></text>

        <g transform="translate(0, 21)">
          <rect x="0" y="-10" width="418" height="138" rx="6" fill="#071318" stroke="#1e293b" stroke-width="1"/>

          <!-- Row 1 -->
          <text x="12" y="10" class="mono-sm c-label">7-Law Matrix</text>
          <text x="136" y="10" class="mono-sm c-muted">[21/21 Cells]</text>
          <rect x="262" y="-3" width="44" height="16" rx="3" fill="#06281e" stroke="#34d399" stroke-opacity="0.4"/>
          <text x="284" y="9" text-anchor="middle" class="mono-xs c-mint">PASS</text>
          <text x="316" y="10" class="mono-xs c-muted">(394ms)</text>

          <!-- Row 2 -->
          <text x="12" y="31" class="mono-sm c-label">Diff Ratchet</text>
          <text x="136" y="31" class="mono-sm c-muted">CDS -14 · +6%</text>
          <rect x="262" y="18" width="44" height="16" rx="3" fill="#06281e" stroke="#34d399" stroke-opacity="0.4"/>
          <text x="284" y="30" text-anchor="middle" class="mono-xs c-mint">PASS</text>
          <text x="316" y="31" class="mono-xs c-muted">(charge.go)</text>

          <!-- Row 3 -->
          <text x="12" y="52" class="mono-sm c-label">Mutation Test</text>
          <text x="136" y="52" class="mono-sm c-muted">6/6 Killed</text>
          <rect x="262" y="39" width="44" height="16" rx="3" fill="#06281e" stroke="#34d399" stroke-opacity="0.4"/>
          <text x="284" y="51" text-anchor="middle" class="mono-xs c-mint">PASS</text>
          <text x="316" y="52" class="mono-xs c-muted">(0 shims)</text>

          <line x1="12" y1="65" x2="406" y2="65" stroke="#1e293b" stroke-width="1"/>

          <text x="12" y="84" class="mono-sm c-mint">✓ All Laws Enforced · 42/42 Gates Satisfied</text>
          <text x="12" y="103" class="mono-sm"><tspan class="c-mint">✓ Merged to main</tspan> <tspan class="c-muted">&amp; pruned worktree SUB-1</tspan></text>
          <text x="12" y="121" class="mono-xs"><tspan class="c-cyan">◈ SHA-256:</tspan> <tspan class="c-value">9f4c2e8a</tspan> <tspan class="c-muted">-&gt; refs/notes/nomos/releases</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- Center Transition Connector (24px gap 458..482; r=9.5 spans 460.5..479.5) -->
  <g transform="translate(470, 271)">
    <circle cx="0" cy="0" r="9.5" fill="#0d1526" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="0" y="3.8" text-anchor="middle" class="mono-xs bold" fill="#38bdf8">→</text>
  </g>
</svg>
